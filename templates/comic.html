<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Hero Comic</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#e8fff0,#eef8ff);color:#173b29}
header{min-height:75px;padding:0 7%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.94);box-shadow:0 5px 20px rgba(0,0,0,.05);position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:bold}
nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
nav a{text-decoration:none;color:#173b29;font-weight:bold;font-size:16px;padding:10px 16px;border-radius:12px}
nav a:hover{background:#e4f7e9;color:#2e9d57}
nav a.active{background:#2e9d57;color:white}
.language-switch{display:flex;gap:4px;padding:4px;background:#e8f8ed;border-radius:12px}
.lang-btn{border:0;background:transparent;color:#527064;padding:7px 10px;border-radius:9px;cursor:pointer;font-weight:bold}
.lang-btn.active{background:#2e9d57;color:white}
.container{width:100%;max-width:1050px;margin:auto;padding:45px 24px 70px}
.title{text-align:center;margin-bottom:30px}
.title h1{font-size:42px;margin-bottom:10px}
.title h1 span{color:#2e9d57}
.title p{font-size:17px;color:#61756a;line-height:1.6}
.comic-pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;align-items:start}
.comic-card{background:#fff;padding:12px;border-radius:24px;box-shadow:0 15px 35px rgba(0,0,0,.08);transition:.2s}
.comic-card:hover{transform:translateY(-4px);box-shadow:0 20px 42px rgba(0,0,0,.12)}
.comic-card img{display:block;width:100%;height:auto;border-radius:16px}
.page-label{text-align:center;font-weight:bold;padding:12px 6px 5px;color:#2e9d57}
@media(max-width:760px){
 header{padding:14px 4%;gap:10px;flex-wrap:wrap}
 .logo{font-size:20px}
 nav{gap:4px}
 nav a{font-size:12px;padding:7px 8px}
 .container{padding:30px 14px 50px}
 .title h1{font-size:32px}
 .comic-pages{grid-template-columns:1fr;gap:18px}
}
</style>
</head>
<body>
<header>
  <div class="logo" data-mn="🐴 Зөв Ангилья" data-en="🐴 Sort It Right">🐴 Зөв Ангилья</div>
  <nav>
    <a href="/" data-mn="🏠 Нүүр" data-en="🏠 Home">🏠 Нүүр</a>
    <a href="/classify" data-mn="📷 Хог ангилах" data-en="📷 Sort Waste">📷 Хог ангилах</a>
    <a href="/about" data-mn="♻️ Хогийн төрлүүд" data-en="♻️ Waste Types">♻️ Хогийн төрлүүд</a>
    <a href="/comic" class="active" data-mn="📖 Комик" data-en="📖 Comic">📖 Комик</a>
    <div class="language-switch">
      <button type="button" class="lang-btn" data-lang="mn" onclick="changeLanguage('mn')">MN</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="changeLanguage('en')">EN</button>
    </div>
  </nav>
</header>

<main class="container">
  <div class="title">
    <h1 data-mn="📖 Eco Hero <span>Комик</span>" data-en="📖 Eco Hero <span>Comic</span>">📖 Eco Hero <span>Комик</span></h1>
    <p data-mn="Eco Hero болон түүний найзуудын байгаль хамгаалах адал явдал."
       data-en="Follow Eco Hero and friends on their adventure to protect the environment.">
       Eco Hero болон түүний найзуудын байгаль хамгаалах адал явдал.
    </p>
  </div>

  <div class="comic-pages">
    <div class="comic-card"><img src="{{ url_for('static', filename='images/comic/comic1.jpg') }}" alt="Comic page 1"><div class="page-label" data-mn="Хуудас 1" data-en="Page 1">Хуудас 1</div></div>
    <div class="comic-card"><img src="{{ url_for('static', filename='images/comic/comic2.jpg') }}" alt="Comic page 2"><div class="page-label" data-mn="Хуудас 2" data-en="Page 2">Хуудас 2</div></div>
    <div class="comic-card"><img src="{{ url_for('static', filename='images/comic/comic3.jpg') }}" alt="Comic page 3"><div class="page-label" data-mn="Хуудас 3" data-en="Page 3">Хуудас 3</div></div>
    <div class="comic-card"><img src="{{ url_for('static', filename='images/comic/comic4.jpg') }}" alt="Comic page 4"><div class="page-label" data-mn="Хуудас 4" data-en="Page 4">Хуудас 4</div></div>
  </div>
</main>

<script>
function changeLanguage(lang){
  localStorage.setItem("language",lang);
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-mn][data-en]").forEach(function(el){
    const value=el.getAttribute("data-"+lang);
    if(el.querySelector("span")) el.innerHTML=value;
    else el.textContent=value;
  });
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));
  const active=document.querySelector('.lang-btn[data-lang="'+lang+'"]');
  if(active) active.classList.add("active");
}
document.addEventListener("DOMContentLoaded",()=>changeLanguage(localStorage.getItem("language")||"mn"));
</script>
</body>
</html>
