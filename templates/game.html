<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco Hero | Mini Game</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#153d2e;background:#eef9f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#d5f5dd,transparent 40%),linear-gradient(145deg,#f7fff9,#e9f5ee)}header{max-width:1000px;margin:20px auto;padding:15px 25px;background:#ffffffd9;border-radius:24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 35px #236e3415;gap:12px}.brand{font-size:23px;font-weight:850;text-decoration:none;color:#18543a}.actions{display:flex;align-items:center;gap:10px}.btn{cursor:pointer;border:0;border-radius:13px;padding:12px 18px;font-weight:750;background:#218b53;color:white;font-size:15px}.btn:focus-visible,.bin:focus-visible{outline:3px solid #102e20;outline-offset:3px}.lang{background:#e7f5e9;color:#176039}.lang.active{background:#218b53;color:#fff}.back{color:#22543b;text-decoration:none;font-weight:700}main{max-width:760px;margin:28px auto;padding:0 18px}.game{background:#fff;border-radius:30px;padding:30px;box-shadow:0 20px 60px #185f3120;text-align:center}h1{font-size:clamp(24px,5vw,34px);margin:10px 0}p{color:#587565}.stats{display:flex;justify-content:space-between;font-weight:800;gap:12px}.progress{height:12px;background:#e9f1ea;border-radius:50px;margin:18px 0;overflow:hidden}.fill{height:100%;width:0;background:#34a765;transition:width .3s}.object{font-size:76px;line-height:1.3;margin:14px 0 2px}.object-name{font-size:23px;font-weight:800;margin-bottom:12px}.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}.bin{background:#f9fcfa;border:2px solid #e3efe6;border-radius:20px;min-height:152px;cursor:pointer;transition:transform .18s,box-shadow .18s;padding:15px}.bin:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 8px 20px #214d2a16}.bin:disabled{cursor:default;opacity:.65}.bin svg{width:68px;height:80px;display:block;margin:0 auto 8px}.bin span{font-size:16px;font-weight:800;color:#234631}.feedback{margin-top:18px;padding:16px;border-radius:16px;background:#eff9ef;font-weight:750}.feedback.wrong{background:#fff4e8;color:#855022}.hidden{display:none!important}.next{margin-top:16px}.finish-icon{font-size:80px}.finish-score{font-size:38px;font-weight:900;color:#239453}.foot{text-align:center;font-size:13px;margin:18px;color:#60806c}@media(max-width:550px){header{margin:10px;padding:12px;flex-wrap:wrap}.game{padding:20px 14px}.bin{min-height:137px}.bin svg{height:68px}.actions{gap:5px}.btn{padding:10px 12px}}
</style>
</head>
<body>
<header><a class="brand" href="/">🌱 Eco Hero</a><div class="actions"><a class="back" href="/" id="home">← Нүүр</a><button class="btn lang active" id="mn" type="button">MN</button><button class="btn lang" id="en" type="button">EN</button></div></header>
<main><section class="game"><div class="stats"><span id="counter">1 / 5</span><span id="score">⭐ 0</span></div><div class="progress"><div class="fill" id="fill"></div></div>
<div id="play"><h1 id="title">Хогоо зөв ангилаарай!</h1><p id="subtitle">Аль өнгийн саванд хийх вэ?</p><div class="object" id="emoji">📰</div><div class="object-name" id="item">Сонин</div><div class="bins" id="bins"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><button id="next" class="btn next hidden" type="button">Дараагийн хог →</button></div>
<div id="finish" class="hidden"><div class="finish-icon">🏆</div><h1 id="finish-title">Тоглоом дууслаа!</h1><div id="final-score" class="finish-score">⭐ 0 / 5</div><p id="finish-note">Мундаг байна!</p><button id="restart" class="btn" type="button">Дахин тоглох</button></div></section><p class="foot" id="note">Батарейг энгийн хогийн саванд биш, зориулалтын цэгт өгнө.</p></main>
<script>
const items=[{emoji:'📰',mn:'Сонин',en:'Newspaper',bin:'paper'},{emoji:'🧴',mn:'Хуванцар сав',en:'Plastic bottle',bin:'plastic'},{emoji:'🥫',mn:'Төмөр лааз',en:'Metal can',bin:'glass'},{emoji:'🍎',mn:'Алимны гол',en:'Apple core',bin:'other'},{emoji:'📦',mn:'Картон хайрцаг',en:'Cardboard box',bin:'paper'}];
const binDefs=[{id:'paper',color:'#198ee6',mn:'Цаас',en:'Paper'},{id:'glass',color:'#f3922e',mn:'Шил, лааз',en:'Glass & cans'},{id:'plastic',color:'#28ad63',mn:'Хуванцар',en:'Plastic'},{id:'other',color:'#424b4a',mn:'Бусад',en:'Other'}];
const tr={mn:{home:'← Нүүр',title:'Хогоо зөв ангилаарай!',subtitle:'Аль өнгийн саванд хийх вэ?',correct:'Зөв байна! ⭐',wrong:'Дахиад суралцацгаая! Зөв сав: ',next:'Дараагийн хог →',results:'Тоглоом дууслаа!',note:'Батарейг энгийн хогийн саванд биш, зориулалтын цэгт өгнө.',restart:'Дахин тоглох',finish:'Сайн ажиллалаа!'},en:{home:'← Home',title:'Sort the waste!',subtitle:'Which bin does it belong in?',correct:'Correct! ⭐',wrong:'Let’s learn! Correct bin: ',next:'Next item →',results:'Game complete!',note:'Batteries must go to a special collection point, not a regular bin.',restart:'Play again',finish:'Great job!'}};
let lang='mn',index=0,score=0,answered=false;
try{lang=localStorage.getItem('language')==='en'?'en':'mn'}catch(e){}
const el=id=>document.getElementById(id);
function binSvg(color){return `<svg viewBox="0 0 80 90" aria-hidden="true"><rect x="13" y="19" width="54" height="65" rx="7" fill="${color}"/><rect x="8" y="12" width="64" height="12" rx="4" fill="${color}"/><rect x="25" y="5" width="30" height="9" rx="4" fill="${color}"/><path d="M30 37V65M40 37V65M50 37V65" stroke="white" stroke-width="3" opacity=".6"/></svg>`}
function render(){document.documentElement.lang=lang;el('mn').classList.toggle('active',lang==='mn');el('en').classList.toggle('active',lang==='en');Object.entries({home:'home',title:'title',subtitle:'subtitle',next:'next', 'finish-title':'results','finish-note':'finish',restart:'restart',note:'note'}).forEach(([id,key])=>el(id).textContent=tr[lang][key]);el('counter').textContent=`${Math.min(index+1,items.length)} / ${items.length}`;el('score').textContent=`⭐ ${score}`;el('fill').style.width=`${Math.min(index+(answered?1:0),items.length)/items.length*100}%`;if(index>=items.length){el('play').classList.add('hidden');el('finish').classList.remove('hidden');el('final-score').textContent=`⭐ ${score} / ${items.length}`;return}el('play').classList.remove('hidden');el('finish').classList.add('hidden');el('emoji').textContent=items[index].emoji;el('item').textContent=items[index][lang];el('bins').innerHTML='';binDefs.forEach(bin=>{const btn=document.createElement('button');btn.className='bin';btn.type='button';btn.disabled=answered;btn.innerHTML=binSvg(bin.color)+`<span>${bin[lang]}</span>`;btn.addEventListener('click',()=>choose(bin.id));el('bins').appendChild(btn)});el('next').classList.toggle('hidden',!answered)}
let selected=null;
function choose(bin){if(answered)return;answered=true;selected=bin;const ok=bin===items[index].bin;if(ok)score++;const msg=ok?tr[lang].correct:tr[lang].wrong+binDefs.find(b=>b.id===items[index].bin)[lang];el('feedback').textContent=msg;el('feedback').className='feedback'+(ok?'':' wrong');render()}
function setLanguage(next){lang=next;try{localStorage.setItem('language',lang)}catch(e){}render();if(answered){const ok=selected===items[index].bin;el('feedback').textContent=ok?tr[lang].correct:tr[lang].wrong+binDefs.find(b=>b.id===items[index].bin)[lang]}}
el('mn').onclick=()=>setLanguage('mn');el('en').onclick=()=>setLanguage('en');el('next').onclick=()=>{index++;answered=false;selected=null;el('feedback').classList.add('hidden');render()};el('restart').onclick=()=>{index=0;score=0;answered=false;selected=null;el('feedback').classList.add('hidden');render()};render();
</script>
</body></html>
